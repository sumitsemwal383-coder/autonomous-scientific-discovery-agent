name: Agent Continuous Integration Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-agent-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Tests
        run: python tests/test_ingestion.py

      - name: Run Statistical Critic Tests
        run: python tests/test_critic_agent.py

      - name: Run LaTeX Synthesis Tests
        run: python tests/test_synthesis.py

      - name: Run Multi-Agent Orchestrator & Self-Debugging Suite
        run: python tests/test_orchestrator.py
